<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

<div class="Form-Container">

    <h1>Registration Form</h1>
    <div>
    <label>Full Name</label>
    <input type="text" placeholder="Enter full name">
    </div>
    <div>
    <label>Email Address</label>
    <input type="email" placeholder="Enter email address">
    </div>
    <div class="row">

        <div class="box">
            <label>Phone Number</label>
            <input type="text" placeholder="Enter phone number">
        </div>

        <div class="box">
            <label>Birth Date</label>
            <input type="date">
        </div>

    </div>
    <div>
    <label>Gender</label>

    <div class="gender">
    <input type="radio" name="gender" checked/><label> Male</label>
    <input type="radio" name="gender"><label> Female</label>
    <input type="radio" name="gender"><label> Prefer not to say</label>
    </div>
    </div>
    <br>
    <div class="address">
    <label>Address</label>
    <input type="text" placeholder="Enter street address">
    <br>
    <input type="text" placeholder="Enter street address line 2">

    <div class="row">

        <div class="box">
            <select>
                <option>Select Country</option>
                <option>India</option>
                <option>USA</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>
        </div>

        <div class="box">
            <input type="text" placeholder="Enter your City">
        </div>

    </div>
    </div>
    <div class="row">

        <div class="box">
            <input type="text" placeholder="Enter your Region">
        </div>

        <div class="box">
            <input type="text" placeholder="Enter Postal Code">
        </div>

    </div>

    <button>Submit</button>

</div>

</body>
</html>
